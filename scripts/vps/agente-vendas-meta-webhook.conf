# Incluir dentro do servidor HTTPS de avanthcode.com. Apenas o endpoint
# assinado da Meta chega ao serviço local; o painel /api/rpc continua em
# 127.0.0.1:8787 e não é publicado.
location = /api/meta/webhook {
    proxy_pass http://127.0.0.1:8787/api/meta/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
