[Unit]
Wants=agente-vendas-meta-vault.service
After=agente-vendas-meta-vault.service

[Service]
# O arquivo é produzido pelo cofre sob a conta AvanthCode e é lido pelo
# systemd. O processo PostFlow recebe somente as variáveis indispensáveis.
EnvironmentFile=-/var/lib/avanthcode-agent/config/sales-agent-meta.env
EnvironmentFile=/etc/postflow-test/sales-agent-bridge.env
# Este arquivo é carregado por último para prevalecer sobre valores legados do
# runtime.env. Ele não contém credenciais e preserva o modo somente-ingestão.
EnvironmentFile=/etc/postflow-test/sales-agent-ingestion.env
